global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ingestion-api
    static_configs:
      - targets: ["ingestion-api:8080"]

  - job_name: profile-consumer
    static_configs:
      - targets: ["profile-consumer:8081"]

  - job_name: strategy-api
    static_configs:
      - targets: ["strategy-api:8082"]
